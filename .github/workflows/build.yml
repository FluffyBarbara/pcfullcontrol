name: Сборка PC Full Control

on:
  push:
    branches: [main, pc-control]
  workflow_dispatch:

# Новая отправка отменяет незаконченную сборку той же ветки — старая не перезапишет релиз поверх новой
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# Сборке достаточно чтения; право писать (публиковать релиз) — только у шага публикации
permissions:
  contents: read

jobs:
  windows:
    name: Установщик Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Установка зависимостей
        run: npm ci

      - name: Тесты
        run: npm test
        timeout-minutes: 10

      - name: Счётчик кадров PresentMon (Intel, MIT)
        shell: pwsh
        run: |
          # Фиксированная версия и контрольная сумма: подменённый файл в сборку не попадёт
          $ver = '2.6.0'
          $sha = 'B2A706BC6AD475749E3B7E3409263AA1E6906D45BDCF993F6DBC0F660188F1AF'
          New-Item -ItemType Directory -Force build/bin | Out-Null
          Invoke-WebRequest "https://github.com/GameTechDev/PresentMon/releases/download/v$ver/PresentMon-$ver-x64.exe" -OutFile build/bin/PresentMon.exe
          if ((Get-FileHash build/bin/PresentMon.exe -Algorithm SHA256).Hash -ne $sha) { throw 'Контрольная сумма PresentMon не совпала' }
          $sig = Get-AuthenticodeSignature build/bin/PresentMon.exe
          Write-Host "Подпись: $($sig.Status) $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'Intel') { throw 'PresentMon не подписан Intel' }
          Invoke-WebRequest "https://raw.githubusercontent.com/GameTechDev/PresentMon/v$ver/LICENSE.txt" -OutFile build/bin/PresentMon-LICENSE.txt -ErrorAction SilentlyContinue

      - name: Чтение SMART дисков — smartmontools (GPL-2.0)
        shell: pwsh
        run: |
          $url = 'https://github.com/smartmontools/smartmontools/releases/download/RELEASE_7_4/smartmontools-7.4-1.win32-setup.exe'
          $sha = '76880E7303403667739066782B1C458EDE2B4462A8EBD6AEACF97EFECD4BDDE7'
          New-Item -ItemType Directory -Force build/bin, $env:RUNNER_TEMP/smt | Out-Null
          Invoke-WebRequest $url -OutFile $env:RUNNER_TEMP/smt/setup.exe
          if ((Get-FileHash $env:RUNNER_TEMP/smt/setup.exe -Algorithm SHA256).Hash -ne $sha) { throw 'Контрольная сумма smartmontools не совпала' }
          7z x $env:RUNNER_TEMP/smt/setup.exe -o"$env:RUNNER_TEMP/smt/x" bin/smartctl.exe bin/drivedb.h doc/COPYING.txt -y | Out-Null
          Copy-Item $env:RUNNER_TEMP/smt/x/bin/smartctl.exe, $env:RUNNER_TEMP/smt/x/bin/drivedb.h build/bin/
          Copy-Item $env:RUNNER_TEMP/smt/x/doc/COPYING.txt build/bin/smartmontools-LICENSE.txt
          & build/bin/smartctl.exe --version | Select-Object -First 1

      - name: Фоновый помощник pcfc-helper.exe (C#, вместо PowerShell)
        shell: pwsh
        run: |
          $csc = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          New-Item -ItemType Directory -Force build/bin | Out-Null
          & $csc /nologo /optimize+ /target:exe /r:System.Management.dll /out:build\bin\pcfc-helper.exe native-win\PcfcHelper.cs
          if ($LASTEXITCODE -ne 0) { throw 'Помощник не собрался' }
          & build/bin/pcfc-helper.exe --sample
          $si = New-Object System.Diagnostics.ProcessStartInfo (Resolve-Path build/bin/pcfc-helper.exe).Path, 'activity usb'
          $si.UseShellExecute = $false; $si.RedirectStandardInput = $true; $si.RedirectStandardOutput = $true
          $p = [System.Diagnostics.Process]::Start($si)
          Start-Sleep 10
          $p.StandardInput.WriteLine("trim $PID"); $p.StandardInput.WriteLine('ping'); $p.StandardInput.Close()
          $out = $p.StandardOutput.ReadToEnd()
          if (-not $p.WaitForExit(10000)) { $p.Kill(); throw 'Помощник не закрылся после закрытия входа' }
          Write-Host $out
          foreach ($m in 'ready', 'A\|', 'U\|ready', 'pong') { if ($out -notmatch $m) { throw "Помощник не ответил: $m" } }

      - name: Сборка установщика
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows
          path: |
            dist/PCFullControl-Setup.exe
            dist/PCFullControl-Setup.exe.blockmap
            dist/latest.yml
          if-no-files-found: error

  android:
    name: Приложение Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: android-app/package-lock.json

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21

      # Один и тот же отладочный ключ между сборками, чтобы обновления ставились поверх
      - name: Отладочный ключ подписи
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: Сборка APK
        run: bash android-app/scripts/ci-build.sh
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android
          path: dist-android/PCControl-Android.apk
          if-no-files-found: error

  e2e-windows:
    name: Проверка на Windows (установка и обновление)
    needs: [windows]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows
          path: out/windows

      - name: Установка, запуск, обновление поверх
        shell: pwsh
        run: ./scripts/e2e-windows.ps1

  release:
    name: Публикация релиза
    if: github.ref == 'refs/heads/main'
    needs: [windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Версия и список изменений
        id: ver
        run: |
          V=$(node -p "require('./package.json').version")
          MM=$(echo "$V" | cut -d. -f1-2)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          # x.y.0 — новый релиз; x.y.1, x.y.2… (исправления) — в тот же релиз vx.y.0
          echo "tag=v$MM.0" >> "$GITHUB_OUTPUT"
          echo "name=$MM" >> "$GITHUB_OUTPUT"
          node scripts/release-notes.js > release-notes.md
          cat release-notes.md

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: out

      - name: Карта блоков под номером версии (для обновлений по разнице)
        run: cp out/windows/PCFullControl-Setup.exe.blockmap "out/windows/PCFullControl-Setup-${{ steps.ver.outputs.version }}.blockmap"

      - name: Исправление — заменить файлы в существующем релизе
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          R="$GITHUB_REPOSITORY"
          if gh release view "$TAG" --repo "$R" >/dev/null 2>&1; then
            # Карту блоков прежней версии сохраняем под её номером — по ней обновляются те, у кого она стоит
            PREV=$(gh release download "$TAG" --repo "$R" -p latest.yml -O - 2>/dev/null | sed -n 's/^version: //p' | head -1)
            NAMES=$(gh release view "$TAG" --repo "$R" --json assets -q '.assets[].name')
            if [ -n "$PREV" ] && ! echo "$NAMES" | grep -qx "PCFullControl-Setup-$PREV.blockmap"; then
              gh release download "$TAG" --repo "$R" -p PCFullControl-Setup.exe.blockmap -O "PCFullControl-Setup-$PREV.blockmap" && \
                gh release upload "$TAG" --repo "$R" "PCFullControl-Setup-$PREV.blockmap" || true
            fi
            for f in PCFullControl-Setup.exe PCFullControl-Setup.exe.blockmap latest.yml PCControl-Android.apk "PCFullControl-Setup-${{ steps.ver.outputs.version }}.blockmap"; do
              gh release delete-asset "$TAG" "$f" --repo "$R" -y 2>/dev/null || true
            done
          fi

      - name: Релиз
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: PC Full Control ${{ steps.ver.outputs.name }}
          body_path: release-notes.md
          make_latest: true
          files: |
            out/windows/PCFullControl-Setup.exe
            out/windows/PCFullControl-Setup.exe.blockmap
            out/windows/PCFullControl-Setup-${{ steps.ver.outputs.version }}.blockmap
            out/windows/latest.yml
            out/android/PCControl-Android.apk
