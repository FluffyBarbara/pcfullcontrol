name: Сборка установщика Windows

on:
  push:
    branches: [main, pc-control]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Установка зависимостей
        run: npm ci

      - name: Тесты
        run: npm test

      - name: Сборка установщика
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Установщик как артефакт сборки
        uses: actions/upload-artifact@v4
        with:
          name: PCFullControl-Setup
          path: dist/*.exe
          if-no-files-found: error

      - name: Версия приложения
        id: ver
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # Каждый push в main публикует релиз v<версия из package.json>.
      # Ссылка .../releases/latest/download/PCFullControl-Setup.exe всегда ведёт на последний установщик.
      - name: Публикация релиза
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: PC Full Control ${{ steps.ver.outputs.version }}
          files: dist/PCFullControl-Setup.exe
          make_latest: true
          body: |
            ## Установка
            1. Скачайте **PCFullControl-Setup.exe** ниже и запустите.
            2. Если Windows покажет «Неизвестный издатель» — «Подробнее» → «Выполнить в любом случае».
            3. В открывшемся приложении на вкладке «Телефон» вставьте токен бота от @BotFather и отсканируйте QR-код телефоном.

            Подробнее — в README репозитория.
