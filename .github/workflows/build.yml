name: Сборка PC Full Control

on:
  push:
    branches: [main, pc-control]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Установщик Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Установка зависимостей
        run: npm ci

      - name: Тесты
        run: npm test

      - name: Сборка установщика
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/PCFullControl-Setup.exe
            dist/PCFullControl-Setup.exe.blockmap
            dist/latest.yml
          if-no-files-found: error

  android:
    name: Приложение Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: android-app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Один и тот же отладочный ключ между сборками, чтобы обновления ставились поверх
      - name: Отладочный ключ подписи
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: Сборка APK
        run: bash android-app/scripts/ci-build.sh
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist-android/PCControl-Android.apk
          if-no-files-found: error

  e2e-windows:
    name: Проверка на Windows (установка и обновление)
    needs: [windows]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: out/windows

      - name: Установка, запуск, обновление поверх
        shell: pwsh
        run: ./scripts/e2e-windows.ps1

  release:
    name: Публикация релиза
    if: github.ref == 'refs/heads/main'
    needs: [windows, android, e2e-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Версия и список изменений
        id: ver
        run: |
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          node scripts/release-notes.js > release-notes.md
          cat release-notes.md

      - uses: actions/download-artifact@v4
        with:
          path: out

      - name: Релиз
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: PC Full Control ${{ steps.ver.outputs.version }}
          body_path: release-notes.md
          make_latest: true
          files: |
            out/windows/PCFullControl-Setup.exe
            out/windows/PCFullControl-Setup.exe.blockmap
            out/windows/latest.yml
            out/android/PCControl-Android.apk
